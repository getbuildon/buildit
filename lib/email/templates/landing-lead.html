<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="x-ua-compatible" content="ie=edge" />
    <title>{{EMAIL_TITLE}}</title>
  </head>
  <body style="margin: 0; padding: 0; background-color: #f4f5f6; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
    <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="background-color: #f4f5f6; padding: 32px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="max-width: 560px; background-color: #ffffff; border: 1px solid #edeef0; border-radius: 14px; overflow: hidden;">
            <tr>
              <td style="background-color: #18191b; padding: 28px 32px;">
                <img
                  src="{{LOGO_URL}}"
                  width="160"
                  height="34"
                  alt="BuildOn"
                  style="display: block; border: 0; outline: none; text-decoration: none; height: 34px; width: 160px;"
                />
                <p style="margin: 12px 0 0; font-size: 13px; line-height: 1.4; color: #afb3ba;">
                  Gestión de proyectos de construcción
                </p>
              </td>
            </tr>
            <tr>
              <td style="padding: 32px;">
                <h1 style="margin: 0 0 12px; font-size: 22px; font-weight: 600; line-height: 1.3; color: #18191b;">
                  {{HEADING}}
                </h1>
                <p style="margin: 0 0 24px; font-size: 15px; line-height: 1.6; color: #363a3f;">
                  {{INTRO}}
                </p>

                <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="border: 1px solid #edeef0; border-radius: 12px; overflow: hidden;">
                  {{ROWS}}
                </table>

                <p style="margin: 24px 0 0; font-size: 13px; line-height: 1.5; color: #696e77;">
                  Enviado desde el formulario de la landing de BuildOn el {{SUBMITTED_AT}}.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
